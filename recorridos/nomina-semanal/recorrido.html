<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Nómina semanal - recorrido</title>
  <style>
    :root { --bg: #f4f1ea; --ink: #1c1917; --muted: #57534e; --line: #e7e5e4; --card: #fff; --teso: #1d4ed8; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.35 "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
    .volver { max-width: 1280px; margin: 0 auto; padding: 8px 16px 0; }
    .volver a, .hermanos a { color: #1c1917; font-weight: 650; text-decoration: none; }
    .volver a:hover, .hermanos a:hover { text-decoration: underline; }
    .hermanos { max-width: 1280px; margin: 0 auto; padding: 0 16px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 16px 0; max-width: 1280px; margin: 0 auto; }
    h1 { font-size: 1.05rem; margin: 0; }
    .layout { display: grid; grid-template-columns: 230px 1fr; gap: 10px; max-width: 1280px; margin: 0 auto; padding: 6px 16px 10px; align-items: start; }
    nav { position: sticky; top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
    nav button.step { display: grid; grid-template-columns: 28px 1fr; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 8px; padding: 4px 6px; cursor: pointer; color: inherit; font: inherit; }
    nav button.step.on { background: #f5f5f4; }
    .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 700; background: var(--teso); }
    .mod { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    .ttl { font-weight: 650; }
    main { min-width: 0; }
    .bar { display: flex; align-items: center; gap: 12px; margin: 0; }
    .bar h2 { margin: 0; font-size: 1rem; }
    .actions { display: flex; gap: 8px; }
    .actions button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 12px; }
    .actions button:disabled { opacity: .4; cursor: default; }
    .frame { position: relative; display: inline-block; max-width: 100%; }
    .frame img { display: block; width: auto; max-width: 100%; max-height: calc(100vh - 168px); height: auto; border-radius: 10px; border: 1px solid var(--line); }
    button.pin { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; padding: 0; border-radius: 50%; border: 2px solid #fff; color: #fff; font-weight: 700; font-size: 13px; background: var(--teso); box-shadow: 0 1px 3px rgba(0,0,0,.4); z-index: 1; opacity: .45; cursor: pointer; }
    button.pin.on { width: 36px; height: 36px; margin: -18px 0 0 -18px; font-size: 16px; opacity: .85; outline: 3px solid #facc15; z-index: 2; }
    .card { margin-top: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
    .card h3 { margin: 0 0 2px; font-size: 0.95rem; }
    .card p { margin: 0; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } nav { position: static; } }
  </style>
</head>
<body>
  <p class="volver"><a href="../../index.html">Volver al inicio</a></p>
  <p class="hermanos"><a href="../../comparaciones/nomina-semanal/comparacion.html">Antes y después de este cambio</a></p>
  <header>
    <h1>Nómina de hoy. El número va sobre el control.</h1>
    <div class="bar">
      <h2 id="title"></h2>
      <div class="actions">
        <button type="button" id="prev">Anterior</button>
        <button type="button" id="next">Siguiente</button>
      </div>
    </div>
  </header>
  <div class="layout">
    <nav id="rail"></nav>
    <main>
      <div id="stage"></div>
      <div class="card" id="card"></div>
    </main>
  </div>
  <script>
    const steps = [
      {
        mod: "Tesorería",
        title: "1. Semanas del periodo",
        img: "01-periodo.png",
        alt: "Nómina en Periodo actual, semana S3 de septiembre",
        pins: [
          { x: 22.6, y: 24.3, t: "Periodo actual", d: "Muestra las semanas del mes de la sesión. Acá es septiembre 2026. S3 está elegida: 1 pendiente, la factura 33-1001 de Agricola Los Naranjos." },
          { x: 46.1, y: 27.8, t: "Semana S3", d: "Cada pastilla trae los pendientes y los atrasados de esa semana. S3 tiene 1 pendiente y 0 atrasados. El vencimiento de 33-1001 es el 21-10-2026, así que el atraso sigue en 0." },
          { x: 56.4, y: 27.8, t: "Semana S4", d: "S4 muestra 3 pendientes. Un clic deja la lista en esa semana. No se cambió de semana en esta pasada." }
        ]
      },
      {
        mod: "Tesorería",
        title: "2. Aviso y Editar",
        img: "01-periodo.png",
        alt: "Filtros de atraso y botón Editar de la nómina",
        pins: [
          { x: 54, y: 54.6, t: "Atrasada", d: "Estos colores son los avisos. Atrasada, Crítico y 90 días también filtran la lista. El atajo no cambia el día en que parte el aviso." },
          { x: 64.8, y: 54.8, t: "Editar", d: "Abre el modal del paso siguiente. No se guardó ningún aviso." }
        ]
      },
      {
        mod: "Tesorería",
        title: "3. Avisos de atraso",
        img: "02-avisos.png",
        alt: "Modal Avisos de atraso, sin guardar",
        pins: [
          { x: 42, y: 29, t: "Atrasada", d: "Parte el día 1. Si el atraso llega a varios avisos, gana el de más días. Pagar no borra el aviso: la fila pasa a Pagada." },
          { x: 70.6, y: 41.1, t: "Día de crítico", d: "Crítico parte el día 30. 90 días parte el día 90. El número de la derecha es el día desde el que se muestra el aviso." },
          { x: 36.5, y: 78.2, t: "Día del proveedor", d: "Un proveedor puede tener su propio día de crítico. Si lo tiene, reemplaza al aviso general solo para él. No se asignó ninguno y no se apretó Guardar." }
        ]
      },
      {
        mod: "Tesorería",
        title: "4. Atrasados histórico",
        img: "03-historico.png",
        alt: "Nómina en Atrasados histórico, de S3 de septiembre a S1 de octubre",
        pins: [
          { x: 30.1, y: 21.1, t: "Atrasados histórico", d: "Abre los pendientes hasta la semana en curso. El rango de esta pasada va de S3 de septiembre a S1 de octubre." },
          { x: 51.9, y: 21.1, t: "Desde", d: "Desde y Hasta recortan ese rango. S1 de octubre figura En curso y tiene 0 pendientes." },
          { x: 20.8, y: 76.5, t: "Factura 59", d: "Además de 33-1001 entran 59, 57 y 56 de ALM SERVICES. El total del rango es $272.986. No se movió ningún documento." }
        ]
      }
    ];

    let step = 0, pin = 0;
    const rail = document.getElementById("rail");
    const stage = document.getElementById("stage");
    const card = document.getElementById("card");
    const title = document.getElementById("title");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");

    steps.forEach((s, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "step";
      b.innerHTML = `<span class="n">${i + 1}</span><span><span class="mod">${s.mod}</span><br><span class="ttl">${s.title.replace(/^\d+\.\s/, "")}</span></span>`;
      b.addEventListener("click", () => show(i, 0));
      rail.appendChild(b);
    });

    function show(i, p) {
      step = i; pin = p;
      const s = steps[i];
      title.textContent = s.title;
      prev.disabled = i === 0 && p === 0;
      next.disabled = i === steps.length - 1 && p === s.pins.length - 1;
      [...rail.children].forEach((el, idx) => el.classList.toggle("on", idx === i));
      stage.innerHTML = "";
      const frame = document.createElement("div");
      frame.className = "frame";
      const img = document.createElement("img");
      img.src = s.img;
      img.alt = s.alt;
      frame.appendChild(img);
      s.pins.forEach((item, idx) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "pin" + (idx === p ? " on" : "");
        b.style.left = item.x + "%";
        b.style.top = item.y + "%";
        b.textContent = String(idx + 1);
        b.title = item.t;
        b.addEventListener("click", () => show(i, idx));
        frame.appendChild(b);
      });
      stage.appendChild(frame);
      const item = s.pins[p];
      card.innerHTML = `<h3>${item.t}</h3><p>${item.d}</p>`;
    }
    function forward() {
      const s = steps[step];
      if (pin < s.pins.length - 1) show(step, pin + 1);
      else if (step < steps.length - 1) show(step + 1, 0);
    }
    function back() {
      if (pin > 0) show(step, pin - 1);
      else if (step > 0) show(step - 1, steps[step - 1].pins.length - 1);
    }
    prev.addEventListener("click", back);
    next.addEventListener("click", forward);
    document.addEventListener("keydown", (ev) => {
      if (ev.key === "ArrowRight") forward();
      if (ev.key === "ArrowLeft") back();
    });
    show(0, 0);
  </script>
</body>
</html>
